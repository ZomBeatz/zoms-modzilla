# Runs the checks on every push and pull request: types, the page's tests and build, and the
# desktop app's own tests (the queue tests start a small stand-in for Nexus Mods on 127.0.0.1).
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Desktop app tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"; then
            # The failing lines as annotations, which show on the run's page and in the API.
            grep -E "^error(\[|:)|panicked at|^---- |assertion|left:|right:|FAILED" "$RUNNER_TEMP/cargo-test.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
