# Publishes the online demo to GitHub Pages: https://zombeatz.github.io/zoms-nexus/
# It's the app's page in a plain browser with made-up games and mods; each visitor's changes stay
# in their own browser tab. One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Online demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "index.html", "package*.json", "vite.config.ts", ".github/workflows/demo.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the demo
        run: npx tsc --noEmit && npx vite build --outDir demo-site
        env:
          NEXUS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
